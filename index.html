<style>
/* Layout: one narrow column, like a page of a chronicle — list of blitz quizzes → quiz page → question card.
   Lapis blue (icon-painting ultramarine) for actions, cinnabar for initials and numerals. */
:root {
  --bg: #ECEEF2;
  --surface: #FFFFFF;
  --surface-2: #F5F6F9;
  --ink: #1A2030;
  --muted: #586074;
  --line: #D5D9E2;
  --accent: #2A44A6;
  --accent-soft: #E4E8F7;
  --accent-ink: #FFFFFF;
  --cinnabar: #B3361F;
  --gold: #B07D1A;
  --ok: #23784A;
  --ok-soft: #E2F2E8;
  --bad: #C0352B;
  --bad-soft: #FBE6E3;
  --font-display: "Old Standard TT", "Times New Roman", Georgia, serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141B; --surface: #191D27; --surface-2: #1F2430; --ink: #E7E9EF; --muted: #9AA2B5; --line: #2D3344;
    --accent: #8EA2F2; --accent-soft: #232C4A; --accent-ink: #0F1426; --cinnabar: #E8735C; --gold: #D9A84C;
    --ok: #5FC48C; --ok-soft: #173327; --bad: #F07467; --bad-soft: #3A1E1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141B; --surface: #191D27; --surface-2: #1F2430; --ink: #E7E9EF; --muted: #9AA2B5; --line: #2D3344;
  --accent: #8EA2F2; --accent-soft: #232C4A; --accent-ink: #0F1426; --cinnabar: #E8735C; --gold: #D9A84C;
  --ok: #5FC48C; --ok-soft: #173327; --bad: #F07467; --bad-soft: #3A1E1C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
.foot { font-size: 13px; color: var(--muted); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, ol, ul { margin: 0; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 72px;
  display: flex; flex-direction: column; gap: 28px;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* buttons */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 9px 14px; font-weight: 500; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  transition: border-color .15s, background-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: -12px; }
.top .btn.ghost { margin-left: -8px; }

/* home */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(38px, 8vw, 54px); line-height: 1.02; letter-spacing: -0.01em; text-wrap: balance; }
.hero h1::first-letter { color: var(--cinnabar); }
.hero p { color: var(--muted); max-width: 54ch; }
.qlist { display: flex; flex-direction: column; gap: 12px; }
.qcard {
  display: grid; grid-template-columns: auto 1fr; gap: 0 18px; align-items: start;
  width: 100%; text-align: left; cursor: pointer;
  padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  transition: border-color .15s, transform .15s;
}
.qcard:hover { border-color: var(--accent); }
.qnum { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: .95; color: var(--cinnabar); min-width: 1.4ch; display: flex; align-items: baseline; gap: 2px; font-variant-numeric: lining-nums; }
.qnum small { font-size: 18px; font-weight: 400; }
.qbody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.qeyebrow { font-size: 13px; color: var(--muted); font-weight: 500; }
.qtitle { font-family: var(--font-display); font-size: 21px; line-height: 1.2; text-wrap: balance; }
.qmeta { font-size: 14px; color: var(--muted); }
.qbody .meter { margin-top: 8px; }
.meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); width: 100%; }
.meter i { display: block; height: 100%; }
.m-ok { background: var(--ok); }
.m-mid { background: var(--gold); }
.addq {
  width: 100%; min-height: 56px; border: 1.5px dashed var(--line); background: transparent; border-radius: var(--r);
  color: var(--accent); font-weight: 600; cursor: pointer;
}
.addq:hover { border-color: var(--accent); background: var(--accent-soft); }
.empty, .notice { padding: 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.empty b, .notice b { color: var(--ink); }

/* quiz page */
.qhead { display: flex; flex-direction: column; gap: 8px; }
.qhead h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5.6vw, 38px); line-height: 1.1; text-wrap: balance; }
.qhead p { color: var(--muted); font-size: 15px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mode-main {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  padding: 18px 20px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.mode-main:hover { filter: brightness(1.08); }
.mm-title { font-size: 20px; font-weight: 600; }
.mm-desc { grid-column: 1; font-size: 15px; opacity: .85; }
.mm-go { grid-column: 2; grid-row: 1 / span 2; font-weight: 600; white-space: nowrap; }
.modes { display: grid; gap: 10px; }
.mode {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; cursor: pointer; min-width: 0;
  padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
}
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode b { font-weight: 600; }
.mode span { font-size: 14px; color: var(--muted); }
.mode:disabled { cursor: not-allowed; opacity: .55; }
.dirrow { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; align-self: flex-start; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.hint { font-size: 14px; color: var(--muted); }
.mastery { display: grid; grid-template-columns: max-content 1fr max-content; gap: 10px 14px; align-items: center; }
.mastery .lbl { font-weight: 500; }
.mastery .num { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--line); }
.dot.ok { background: var(--ok); }
.dot.mid { background: var(--gold); }
.history { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.history li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; align-items: baseline; }
.history .when { color: var(--muted); font-size: 13px; }
.history .sc { font-variant-numeric: tabular-nums; font-weight: 600; }
.plain { list-style: none; padding: 0; }
.dz { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--bad-soft); width: 100%; }
.confirm .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* run */
.runbar { display: flex; align-items: center; gap: 12px; }
.runbar .btn.ghost { margin-left: -8px; flex: none; }
.steps { display: flex; gap: 4px; flex: 1; min-width: 0; }
.steps.dense { gap: 2px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); min-width: 2px; }
.steps i.cur { background: var(--accent); }
.steps i.ok { background: var(--ok); }
.steps i.bad { background: var(--bad); }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; flex: none; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
  display: flex; flex-direction: column; gap: 18px;
}
.card.enter { animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } }
.qtop { display: flex; flex-direction: column; gap: 8px; }
.chip { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.ask { color: var(--muted); font-size: 15px; }
.prompt { font-family: var(--font-display); font-size: clamp(23px, 4.8vw, 30px); line-height: 1.25; text-wrap: pretty; overflow-wrap: anywhere; }
.prompt.long { font-family: var(--font-body); font-size: 19px; line-height: 1.5; }
.prompt.mono { font-family: var(--font-mono); font-size: clamp(34px, 8vw, 44px); font-weight: 600; letter-spacing: -0.01em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
  padding: 12px 14px; min-height: 54px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); cursor: pointer;
  transition: border-color .15s, background-color .15s, opacity .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; opacity: 1; }
.opt .k { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt .t.mono { font-size: 18px; font-weight: 500; }
.opt .t.small { font-size: 15px; line-height: 1.45; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .k { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .k { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .5; }
.feedback { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding: 12px 14px 12px 16px; border-radius: var(--r); }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .verdict { font-weight: 600; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }
.feedback .fb { min-width: 0; flex: 1 1 220px; }
.keys { font-size: 13px; color: var(--muted); text-align: center; }
@media (hover: none) { .keys { display: none; } }

/* result */
.score { display: flex; align-items: baseline; gap: 12px; }
.score .big { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: .9; color: var(--cinnabar); font-variant-numeric: lining-nums; }
.score .of { font-family: var(--font-display); font-size: 28px; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.review { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.review li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.review .mk { font-weight: 700; line-height: 1.5; }
.review .mk.ok { color: var(--ok); }
.review .mk.bad { color: var(--bad); }
.review .pair { min-width: 0; overflow-wrap: anywhere; }
.review .pair b { font-weight: 600; }
.review .yours { font-size: 14px; color: var(--bad); margin-top: 2px; }

/* list */
.cards { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cards li { display: grid; grid-template-columns: 12px minmax(120px, 190px) 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.cards .dot { align-self: center; }
.cards .ans { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.cards .ans.mono { font-weight: 500; }
.cards .pr { min-width: 0; color: var(--ink); overflow-wrap: anywhere; }
.cards .ans.hide { background: var(--line); color: transparent; border-radius: 4px; cursor: pointer; user-select: none; }
.cards .ans.hide.shown { background: transparent; color: var(--ink); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (max-width: 540px) {
  .cards li { grid-template-columns: 12px 1fr; }
  .cards .pr { grid-column: 2; }
}

/* import */
.drop {
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  padding: 28px 20px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.fmt { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.fmt table { border-collapse: collapse; font-size: 14px; }
.fmt td { border: 1px solid var(--line); padding: 4px 10px; color: var(--ink); }
.fmt tr:first-child td { font-weight: 600; }
.fields { display: grid; grid-template-columns: 110px 1fr; gap: 12px; }
.fields .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field span { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; min-height: 44px;
}
.ticket-in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.err { color: var(--bad); font-weight: 500; }
.warn { padding: 10px 14px; border-radius: 8px; background: var(--bad-soft); color: var(--ink); font-size: 14px; }
.preview { max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 4px 14px; }
.preview h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 0 6px; }
.preview .cards li { grid-template-columns: minmax(110px, 170px) 1fr; }
@media (max-width: 540px) { .preview .cards li { grid-template-columns: 1fr; gap: 2px; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 15px; z-index: 20;
  max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
(() => {

const CATS = {

            ask: 'Когда это было?', rask: a => /[–-]/.test(a) ? 'Что происходило в эти годы?' : 'Что произошло в этом году?' },
  term:   { label: 'Термин',   plural: 'Термины',  forms: ['термин', 'термина', 'терминов'],
            ask: 'Какой это термин?', rask: () => 'Что означает этот термин?' },
  person: { label: 'Личность', plural: 'Личности', forms: ['личность', 'личности', 'личностей'],
            ask: 'О ком идёт речь?', rask: () => 'Чем известен этот человек?' },

  reverse: 'Дата → событие, термин → определение, личность → описание.',
  mixed: 'Оба направления в случайном порядке.',
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);

function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
function when(t) {
  if (!t) return '';
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'сегодня, ' + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчера, ' + hm;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + hm;

/* ---------- state ---------- */
const S = {

  if (!d || !Array.isArray(d.items)) return null;

    .filter(it => it && CATS[it.cat] && typeof it.answer === 'string' && typeof it.prompt === 'string' && it.answer.trim() && it.prompt.trim())

    id, items, ticket,
    title: String(d.title || 'Блиц-опрос'),
    subtitle: String(d.subtitle || ''),

/* ---------- progress ---------- */
const statsOf = qid => (S.progress[qid] && S.progress[qid].stats) || {};

}

function ensureProgress(qid) {
  const p = S.progress[qid] || (S.progress[qid] = { stats: {}, runs: [] });
  if (!p.stats || typeof p.stats !== 'object') p.stats = {};
  if (!Array.isArray(p.runs)) p.runs = [];

}

function saveProgress() { lsSet(LS_PROGRESS, S.progress); }

/* ---------- building a test ---------- */
function makeQ(quiz, it, dir) {
  const reverse = dir === 'reverse' || (dir === 'mixed' && Math.random() < 0.5);
  const key = reverse ? 'prompt' : 'answer';
  const same = quiz.items.filter(x => x.cat === it.cat && x.id !== it.id && norm(x.answer) !== norm(it.answer));
  const seen = new Set([norm(it[key])]);
  let pool = [];
  for (const x of same) { const k = norm(x[key]); if (!seen.has(k)) { seen.add(k); pool.push(x); } }

    const y = yearOf(it.answer);
    if (!isNaN(y)) pool = pool.slice().sort((a, b) => Math.abs(yearOf(a.answer) - y) - Math.abs(yearOf(b.answer) - y)).slice(0, 6);
  }
  const distract = shuffle(pool).slice(0, 3).map(x => ({ text: x[key], ok: false }));
  return { item: it, reverse, options: shuffle([{ text: it[key], ok: true }, ...distract]), picked: null };
}
function buildRun(quiz, mode, items) {
  let list = [];
  if (mode === 'ticket') CAT_ORDER.forEach(c => list.push(...shuffle(catItems(quiz, c)).slice(0, quiz.ticket[c] || 0)));
  else if (mode === 'all') list = shuffle(quiz.items);
  else if (CATS[mode]) list = shuffle(catItems(quiz, mode));
  else if (mode === 'weak') list = shuffle(weakItems(quiz));

  if (!list.length) return null;
  return { qid: quiz.id, mode, dir: S.dir, i: 0, qs: list.map(it => makeQ(quiz, it, S.dir)), retryItems: mode === 'retry' ? items : null };
}
function startRun(mode, items) {

}
function pick(idx) {
  const r = S.run; if (!r) return;
  const q = r.qs[r.i]; if (!q || q.picked !== null || !q.options[idx]) return;

}

}

  const r = S.run; if (!r) return;

}

const WNS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

async function parseDocx(file) {

    if (!rest) { const m = title.match(/^(.*?)\s*[«"“](.+)$/); if (m) { title = m[1]; rest = m[2]; } }
    if (!rest) { const nx = before.slice(ti + 1).find(p => !/вопрос|включа|билет/i.test(p.text)); if (nx) rest = nx.text.replace(/\n/g, ' '); }

  } else if (before.length) {

  }

  subtitle = subtitle.replace(/^[\s«"“'@]+|[\s»"”'@.]+$/g, '').replace(/\s+/g, ' ').trim();
  const noteP = paras.find(p => /вопросы для подготовки|включают/i.test(p.text));
  if (noteP) note = noteP.text.replace(/\s+/g, ' ').replace(/^вопросы для подготовки включают\s*/i, '').replace(/(\d)\s*-+\s*([XVI])/g, '$1–$2').trim();

  let number = null;
  const nm = title.match(/№\s*(\d+)/) || file.name.match(/(?:блиц|blits|blitz|опрос|opros)[^\d]{0,4}(\d+)/i);
  if (nm) number = +nm[1];

}

  const id = number != null ? 'blitz-' + number : p.fallbackId;
  if (!force && S.quizzes.some(x => x.id === id)) { S.confirm = 'replace'; render(); return; }
  const ticket = {};
  CAT_ORDER.forEach(c => { const v = parseInt(e['t_' + c] != null ? e['t_' + c] : p.ticket[c], 10); ticket[c] = Number.isFinite(v) ? Math.max(0, Math.min(20, v)) : 0; });
  const doc = {
    title: fld('title') || (number != null ? 'Блиц-опрос №' + number : 'Блиц-опрос'),
    subtitle: fld('subtitle'), note: p.note || '', number, order: number != null ? number : 999,
    ticket, items: p.items, source: I.name || '', updatedAt: Date.now(),
  };
  I.saving = true; I.saveError = ''; S.confirm = null; render();
  try {
    const local = lsGet(LS_QUIZZES, {}) || {};
    local[id] = doc;
    localStorage.setItem(LS_QUIZZES, JSON.stringify(local));
    loadQuizzes();
    S.imp = null; S.qid = id;
    go('quiz'); toast('Опрос сохранён');
  } catch (err) {
    I.saving = false;
    I.saveError = 'Браузер не дал сохранить опрос. Так бывает в режиме инкогнито или когда закончилось место для сайтов. Откройте сайт в обычном окне и попробуйте ещё раз.';
    render();
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case 'home': S.run = null; go('home'); break;
    case 'open': S.qid = el.dataset.id; S.confirm = null; go('quiz'); break;
    case 'start': startRun(el.dataset.mode); break;
    case 'dir': S.dir = el.dataset.dir; lsSet(LS_DIR, S.dir); render(); break;
    case 'pick': pick(+el.dataset.i); break;
    case 'next': next(); break;
    case 'exit': clearTimeout(autoTimer); S.run = null; go('quiz'); break;
    case 'again': {
      const res = S.result; if (!res) break;
      if (res.mode === 'retry') startRun('retry', res.retryItems); else startRun(res.mode);
      break;
    }
    case 'retry': {
      const res = S.result; if (!res) break;
      startRun('retry', res.qs.filter(x => !x.options[x.picked].ok).map(x => x.item));
      break;
    }
    case 'back-quiz': S.result = null; go('quiz'); break;
    case 'list': go('list'); break;
    case 'reveal': el.classList.toggle('shown'); break;
    case 'import': S.imp = null; S.confirm = null; go('import'); break;
    case 'imp-save': saveImport(false); break;
    case 'imp-replace': saveImport(true); break;
    case 'imp-reset': S.imp = null; S.confirm = null; render(); break;
    case 'ask-reset': S.confirm = 'reset'; render(); break;
    case 'ask-delete': S.confirm = 'delete'; render(); break;
    case 'cancel': S.confirm = null; render(); break;
    case 'do-reset': {
      const q = curQuiz(); if (!q) break;
      S.progress[q.id] = { stats: {}, runs: [] }; saveProgress(q.id); S.confirm = null; render(); toast('Прогресс сброшен');
      break;
    }
    case 'do-delete': {
      const q = curQuiz(); if (!q || !q.local) break;
      S.confirm = null;
      const local = lsGet(LS_QUIZZES, {}) || {};
      delete local[q.id];
      lsSet(LS_QUIZZES, local);
      loadQuizzes();
      go(curQuiz() ? 'quiz' : 'home'); toast('Опрос удалён');
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input, textarea, select')) {
    return;
  }
  if (e.target && e.target.dataset && e.target.dataset.act === 'reveal' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.classList.toggle('shown'); return; }
  if (S.view !== 'run' || !S.run || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = S.run.qs[S.run.i];
  if (/^[1-9]$/.test(e.key) && q.picked === null) {
    const i = +e.key - 1; if (i < q.options.length) { e.preventDefault(); pick(i); }
  } else if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && q.picked !== null) {
    e.preventDefault(); next();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  if (e.target.id === 'hide-answers') { S.hideAns = e.target.checked; lsSet(LS_HIDE, S.hideAns); render(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.imp;
  if (k && S.imp) { S.imp.edit[k] = e.target.value; if (S.confirm === 'replace') { S.confirm = null; } }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('#drop');
  if (!d) return;
  e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});

/* ---------- data wiring ---------- */
function sortQuizzes(list) { return list.slice().sort((a, b) => (a.order - b.order) || a.title.localeCompare(b.title, 'ru')); }
const LS_QUIZZES = 'blitz-quizzes-v1';
function loadQuizzes() {
  let builtin = [];
  try { builtin = JSON.parse($('quiz-data').textContent); } catch (e) { builtin = []; }
  const map = new Map();
  (Array.isArray(builtin) ? builtin : []).forEach(d => { const q = d && d.id && cleanQuiz(String(d.id), d); if (q) map.set(q.id, q); });
  const local = lsGet(LS_QUIZZES, {}) || {};
  Object.keys(local).forEach(id => { const q = cleanQuiz(id, local[id]); if (q) { q.local = true; map.set(id, q); } });
  S.quizzes = sortQuizzes([...map.values()]);
}
// another open tab changed progress or quizzes
window.addEventListener('storage', e => {
  if (e.key === LS_QUIZZES) loadQuizzes();
  else if (e.key === LS_PROGRESS) S.progress = lsGet(LS_PROGRESS, {}) || {};
  else return;
  if (S.view !== 'run' && S.view !== 'import') render();
});
loadQuizzes();
render();
})();
</script>
